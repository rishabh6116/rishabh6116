<svg width="100%" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#818cf8">
        <animate attributeName="offset" values="1;1.6;1" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <rect width="900" height="200" fill="url(#bg)"/>

  <text x="50" y="90" font-family="Segoe UI, Verdana, sans-serif" font-size="42" font-weight="700" fill="#f8fafc">
    Rishabh Singh
  </text>

  <text x="50" y="130" font-family="Segoe UI, Verdana, sans-serif" font-size="20" fill="url(#accent)">
    Full-Stack Developer (MERN) · CS Undergrad
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </text>

  <rect x="50" y="150" width="0" height="3" fill="#818cf8">
    <animate attributeName="width" values="0;120;0" dur="4s" repeatCount="indefinite"/>
  </rect>

  <text x="850" y="180" text-anchor="end" font-family="Segoe UI, Verdana, sans-serif" font-size="14" fill="#94a3b8">
    imrishabh.vercel.app
  </text>
</svg>
